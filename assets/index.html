<!DOCTYPE html>
<html>
  <head><style type="text/css">
  html{font-family:sans-serif;font-size:1rem;}
  li{border-bottom:solid 1px;margin-bottom: 3px;;}
  .req{color:blue}
  .res{color:cornflowerblue}
  .res_err{color:red}
</style>

<title>HTTP(S) dump tool</title>
</head>
<body>
<h1><img src="logo.svg" style="height:50px"/> Dump http(s) traffic from server <span id="host"></span></h1>
<div id="messages" style="width:100%;display:block;list-style-position: inside;list-style-type: disclosure-open;"><br/></div>
</body>
<script type="text/javascript">
  const host= window.location.host;
document.getElementById("host").append(host);
const socket = new WebSocket('ws://'+host+'/ws');
socket.addEventListener('message', e => {
    var item=document.createElement("li");
    item.setAttribute("class",e.data.startsWith("Request")?"req":e.data.includes("status: 20")?"res":"res_err");
    item.append(e.data);
    document.getElementById("messages").firstElementChild.before( item);
});
</script>
</html>
